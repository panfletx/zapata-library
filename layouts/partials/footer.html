<footer class="site-footer">
  <div class="footer-inner">
    <nav class="footer-nav" aria-label="{{ i18n "footer_nav" | default "Footer navigation" }}">
      <a href="{{ .Site.Home.RelPermalink }}" class="footer-nav-link{{ if .IsHome }} active{{ end }}"{{ if .IsHome }} aria-current="page"{{ end }}>{{ i18n "home" }}</a>
      <a href="{{ relLangURL "about" }}" class="footer-nav-link{{ if eq .RelPermalink (relLangURL "about/") }} active{{ end }}"{{ if eq .RelPermalink (relLangURL "about/") }} aria-current="page"{{ end }}>{{ i18n "about" }}</a>
    </nav>
    <p>&copy; {{ now.Year }} {{ .Site.Title }}</p>
  </div>
</footer>
