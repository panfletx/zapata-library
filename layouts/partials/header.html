<header class="site-header">
  <div class="header-inner">
    <a href="{{ .Site.Home.RelPermalink }}" class="site-title" data-short="Luis Zapata">{{ .Site.Title }}</a>

    <nav id="main-nav" class="main-nav">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL }}" class="nav-link{{ if $.IsMenuCurrent "main" . }} active{{ end }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>

    <div class="lang-toggle">
      {{ range .AllTranslations }}
        <a href="{{ .RelPermalink }}" class="lang-link{{ if eq $.Lang .Lang }} active{{ end }}"{{ if eq $.Lang .Lang }} aria-current="true"{{ end }} data-short="{{ .Lang | upper }}">{{ .Language.LanguageName }}</a>
      {{ end }}
    </div>

    <button class="mobile-menu-btn"
      aria-label="{{ i18n "open_menu" }}"
      aria-expanded="false"
      aria-controls="main-nav"
      onclick="var expanded=this.getAttribute('aria-expanded')==='true';this.setAttribute('aria-expanded',expanded?'false':'true');document.getElementById('main-nav').classList.toggle('open')">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
