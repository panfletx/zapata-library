<header class="site-header">
  <div class="header-inner">
    <a href="{{ "/" | relLangURL }}" class="site-title">{{ .Site.Title }}</a>

    <nav class="main-nav">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL | relLangURL }}" class="nav-link{{ if $.IsMenuCurrent "main" . }} active{{ end }}">{{ .Name }}</a>
      {{ end }}
    </nav>

    <div class="lang-toggle">
      {{ range .Site.Home.AllTranslations }}
        <a href="{{ .RelPermalink }}" class="lang-link{{ if eq $.Lang .Lang }} active{{ end }}">{{ .Language.LanguageName }}</a>
      {{ end }}
    </div>

    <button class="mobile-menu-btn" aria-label="Menu" onclick="document.querySelector('.main-nav').classList.toggle('open')">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
