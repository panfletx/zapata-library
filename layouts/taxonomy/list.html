{{ define "main" }}
<section class="section">
  <h1>{{ .Title }}</h1>
  <p class="taxonomy-count-label">{{ len .Pages }} {{ i18n "items" }}</p>

  <div class="book-grid">
    {{ range .Paginator.Pages }}
      {{ partial "book-card.html" . }}
    {{ end }}
  </div>

  {{ template "_internal/pagination.html" . }}
</section>
{{ end }}
