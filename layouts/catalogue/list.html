{{ define "main" }}
<section class="section catalogue-app">
  <h1>{{ i18n "catalogue" }}</h1>

  <div class="catalogue-toolbar">
    <div class="toolbar-search">
      <input type="text" id="search-input" placeholder="{{ i18n "search_placeholder" }}" autocomplete="off">
    </div>
    <div class="toolbar-controls">
      <span id="results-count" class="results-count"></span>
      <div class="display-toggle">
        <button id="view-grid" class="toggle-btn active" aria-label="{{ i18n "grid_view" }}" title="{{ i18n "grid_view" }}">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><rect x="0" y="0" width="8" height="8"/><rect x="10" y="0" width="8" height="8"/><rect x="0" y="10" width="8" height="8"/><rect x="10" y="10" width="8" height="8"/></svg>
        </button>
        <button id="view-table" class="toggle-btn" aria-label="{{ i18n "table_view" }}" title="{{ i18n "table_view" }}">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><rect x="0" y="0" width="18" height="3"/><rect x="0" y="5" width="18" height="3"/><rect x="0" y="10" width="18" height="3"/><rect x="0" y="15" width="18" height="3"/></svg>
        </button>
      </div>
      <button id="filter-toggle-btn" class="btn btn-sm filter-toggle-btn">{{ i18n "filters" }}</button>
    </div>
  </div>

  <div id="active-filters" class="active-filters"></div>

  <div class="catalogue-layout">
    <aside id="filters" class="filter-sidebar">
      <div class="filter-sidebar-header">
        <strong>{{ i18n "filters" }}</strong>
        <button id="clear-all" class="clear-all-btn">{{ i18n "clear_all" }}</button>
      </div>
      <div id="filter-groups"></div>
    </aside>
    <div id="results" class="catalogue-results">
      <div id="loading" class="loading">{{ i18n "loading" }}...</div>
    </div>
  </div>

  <div id="pagination" class="catalogue-pagination"></div>
</section>

<!-- Fallback for no-JS -->
<noscript>
  <div class="book-grid">
    {{ range .Paginator.Pages }}
      {{ partial "book-card.html" . }}
    {{ end }}
  </div>
  {{ template "_internal/pagination.html" . }}
</noscript>

{{ $js := resources.Get "js/catalogue.js" }}
{{ if $js }}
<script>
window.CATALOGUE_I18N = {
  decade:    "{{ i18n "decade" }}",
  language:  "{{ i18n "language" }}",
  item_type: "{{ i18n "item_type" }}",
  place:     "{{ i18n "place" }}",
  publisher: "{{ i18n "publisher" }}",
  author:    "{{ i18n "author" }}",
  series:    "{{ i18n "series" }}"
};
</script>
<script src="{{ $js.RelPermalink }}"></script>
{{ end }}
{{ end }}
