<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ if .IsHome }}{{ if eq .Lang "es" }}{{ .Site.Params.description_es }}{{ else }}{{ .Site.Params.description_en }}{{ end }}{{ else }}{{ .Title }}{{ end }}">
  {{ $css := resources.Get "css/main.css" }}
  {{ if $css }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  {{ end }}
</head>
<body>
  {{ partial "header.html" . }}

  <main class="main">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}
</body>
</html>
