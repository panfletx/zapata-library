baseURL = "https://luiszapata.org/"
title = "Biblioteca Zapata"
defaultContentLanguage = "es"
defaultContentLanguageInSubdir = true
enableRobotsTXT = true
[pagination]
  pagerSize = 24

[taxonomies]
  author    = "authors"
  publisher = "publishers"
  subject   = "subjects"
  language  = "languages"
  item_type = "item_types"
  series    = "series"

[outputs]
  home = ["HTML"]
  section = ["HTML", "JSON"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[[module.mounts]]
  source = "content"
  target = "content"
  lang = "es"

[[module.mounts]]
  source = "content"
  target = "content"
  lang = "en"

[[module.mounts]]
  source = "static"
  target = "static"

[[module.mounts]]
  source = "assets"
  target = "assets"

[[module.mounts]]
  source = "layouts"
  target = "layouts"

[[module.mounts]]
  source = "i18n"
  target = "i18n"

[[module.mounts]]
  source = "archetypes"
  target = "archetypes"

[[module.mounts]]
  source = "data"
  target = "data"
