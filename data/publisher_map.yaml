# publisher_map.yaml
#
# Maps variant publisher strings → canonical form(s).
# Values are always lists. An empty list [] means "drop this entry" (e.g., distributors).
# Multiple items in the list split the entry into separate publishers.
#
# Used by scripts/normalize-publishers.py which:
#   1. Checks the map for exact matches (handles "/" compounds and comma combos)
#   2. Auto-splits on " : " and " ; ", checking each part against this map

